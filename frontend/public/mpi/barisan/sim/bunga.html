<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peraga bunga tunggal dan majemuk</title>
<style>
:root{--g:#1f8a4c;--g2:#dff2e4;--y:#ffd23f;--y2:#fff4c7;--c:#ef5b3f;--c2:#ffe3dc;--ink:#173020;--mute:#4d6655;--line:#cfe0d3;--paper:#fff}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Nunito,"Segoe UI",Arial,sans-serif}
.wrap{padding:16px;max-width:900px;margin:auto}
.goal{background:var(--y2);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.win{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-top:12px;display:none}
.win.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.big{font:800 clamp(36px,7vw,60px)/1.05 "Baloo 2",Nunito,sans-serif;color:var(--g)}.big sup{font-size:.5em;color:var(--c)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:620px){.row{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:grid;gap:2px;margin:8px 0}.ctrl label{font-weight:800;display:flex;justify-content:space-between}.ctrl output{color:var(--c);font-weight:800;font-size:20px}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:800 22px "Baloo 2",Nunito,sans-serif;min-width:46px;height:46px;padding:0 10px;border-radius:12px;display:inline-grid;place-items:center;background:var(--g2);color:var(--g)}
.chip.y{background:var(--y);color:#2b2300}.chip.c{background:var(--c);color:#fff}
.mute{color:var(--mute);font-size:15px}
svg text{font:700 14px Nunito,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}td.n{background:var(--y2);font-weight:800}
.scroll{overflow-x:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--g2);border-radius:12px;padding:4px;gap:4px}.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font:800 15px Nunito;color:var(--ink);cursor:pointer;min-height:40px}.seg button[aria-pressed=true]{background:#fff;color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="goal" id="goal"></div>
<div class="row"><div><div style="position:relative;height:280px"><svg id="svg" style="position:absolute;inset:0;width:100%;height:100%" role="img" aria-label="Grafik bunga tunggal dan majemuk"></svg></div>
<div class="ctrl"><label for="t">Tahun ke- <output id="to"></output></label><input type="range" id="t" min="0" max="20" value="0"></div></div>
<div><div class="ctrl"><label for="i">Bunga per tahun <output id="io"></output></label><input type="range" id="i" min="1" max="20" value="5"></div>
<p style="margin:6px 0"><span style="display:inline-block;width:14px;height:4px;background:#9fb3a5;vertical-align:middle"></span> <b>Tunggal:</b> <span id="vt"></span></p>
<p style="margin:6px 0"><span style="display:inline-block;width:14px;height:4px;background:#ef5b3f;vertical-align:middle"></span> <b>Majemuk:</b> <span id="vm"></span></p>
<p class="mute" id="ket"></p>
<div id="q" style="display:none;background:#dff2e4;border-radius:14px;padding:12px 14px"><b id="qt"></b><div class="btns" id="opts"><button class="btn ghost" data-k="t">Tunggal</button><button class="btn ghost" data-k="m">Majemuk</button><button class="btn ghost" data-k="s">Sama besar</button></div><p id="fb" style="margin:8px 0 0"></p></div></div></div><div class="win" id="win" role="status"></div></div><script>
/* Jembatan MPI: menerima mpi:init dari LMS, mengirim mpi:ready, mpi:resize, mpi:progress, mpi:done */
const MPI={params:{},started:false,_done:false,
 post(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}},
 done(detail){if(this._done)return;this._done=true;this.post({type:'mpi:done',detail:detail||{}})},
 progress(detail){this.post({type:'mpi:progress',detail})}};
(function(){
 const q=new URLSearchParams(location.search);q.forEach((v,k)=>{MPI.params[k]=isNaN(+v)||v===''?v:+v});
 function go(){MPI.started=true;try{window.start(MPI.params)}catch(e){console.error(e)}}
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='mpi:init'){Object.assign(MPI.params,d.params||{});MPI._done=false;go()}});
 const ro=new ResizeObserver(()=>MPI.post({type:'mpi:resize',height:Math.ceil(document.documentElement.scrollHeight)}));ro.observe(document.body);
 window.addEventListener('load',()=>{MPI.post({type:'mpi:ready'});setTimeout(()=>{if(!MPI.started)go()},400)});
})();
const $=id=>document.getElementById(id);
const fmt=n=>Number.isInteger(n)?n.toLocaleString('id-ID'):n.toLocaleString('id-ID',{maximumFractionDigits:3});
const sup=n=>'<sup>'+n+'</sup>';
function win(html){const w=$('win');w.innerHTML=html;w.classList.add('on')}
</script><script>
let P={};const mt=(t,i)=>P.m*(1+t*i/100),mm=(t,i)=>P.m*(1+i/100)**t,rp=v=>'Rp'+Math.round(v).toLocaleString('id-ID');
function draw(){const s=$('svg'),W=s.clientWidth,H=s.clientHeight;if(!W||!P.m)return;const T=+$('t').value,i=+$('i').value,MX=P.maxT,L=78,R=12,Tp=12,B=28,max=mm(MX,i);
 const px=t=>L+(W-L-R)*t/MX,py=v=>Tp+(H-Tp-B)*(1-(v-P.m*0.9)/(max-P.m*0.9));let g='';
 for(let k=0;k<=4;k++){const v=P.m*0.9+(max-P.m*0.9)*k/4,y=py(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e3ece5"/><text x="'+(L-6)+'" y="'+(y+5)+'" text-anchor="end" style="font-size:12px">'+(W<440&&k%2?'':(v/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+' jt')+'</text>'}
 for(let t=0;t<=MX;t+=MX>10?5:1)g+='<text x="'+px(t)+'" y="'+(H-8)+'" text-anchor="middle">'+t+'</text>';
 let a='',b='';for(let t=0;t<=MX;t++){a+=(t?'L':'M')+px(t)+','+py(mt(t,i));b+=(t?'L':'M')+px(t)+','+py(mm(t,i))}
 g+='<path d="'+a+'" fill="none" stroke="#9fb3a5" stroke-width="3" stroke-dasharray="6 5"/><path d="'+b+'" fill="none" stroke="#ef5b3f" stroke-width="4"/>';
 g+='<line x1="'+px(T)+'" x2="'+px(T)+'" y1="'+Tp+'" y2="'+(H-B)+'" stroke="#173020" stroke-width="1" stroke-dasharray="3 3"/><circle cx="'+px(T)+'" cy="'+py(mm(T,i))+'" r="6" fill="#ef5b3f"/><circle cx="'+px(T)+'" cy="'+py(mt(T,i))+'" r="5" fill="#9fb3a5"/>';s.innerHTML=g}
function upd(){const T=+$('t').value,i=+$('i').value;$('to').textContent=T;$('io').textContent=i+'%';
 $('vt').innerHTML=rp(mt(T,i))+' <span class="mute">= modal × (1 + '+T+' × '+i+'%)</span>';$('vm').innerHTML=rp(mm(T,i))+' <span class="mute">= modal × (1 + '+i+'%)'+sup(T)+'</span>';
 $('ket').textContent=T?'Selisih: '+rp(mm(T,i)-mt(T,i))+'. Pada bunga majemuk, bunga juga dihitung dari bunga tahun sebelumnya.':'Geser tahun untuk melihat pertumbuhannya.';
 draw();if(T===P.qT&&i===P.qI)$('q').style.display='block'}
function start(p){P={m:p.modal||1000000,maxT:p.maxT||20,qT:p.qT||5,qI:p.qI||5};$('t').max=P.maxT;$('t').value=0;$('i').value=P.qI;$('q').style.display='none';$('fb').textContent='';$('win').classList.remove('on');
 $('goal').textContent='Modal awal '+rp(P.m)+'. Geser ke tahun ke-'+P.qT+' dengan bunga '+P.qI+'% per tahun, lalu jawab pertanyaannya.';$('qt').textContent='Pada tahun ke-'+P.qT+', nilai uang mana yang lebih besar?';upd()}
$('t').oninput=upd;$('i').oninput=upd;
$('opts').onclick=e=>{const c=e.target.dataset.k;if(!c)return;const a=mt(P.qT,P.qI),b=mm(P.qT,P.qI);
 if(c==='m'){$('fb').innerHTML='<b>Betul!</b>';win('Bunga tunggal: '+rp(a)+' (barisan aritmetika, bertambah tetap). Bunga majemuk: '+rp(b)+' (barisan geometri, dikali '+(1+P.qI/100).toLocaleString('id-ID')+' tiap tahun). Makin lama, selisihnya makin besar.');MPI.done({choice:c})}
 else if(c==='t')$('fb').textContent='Coba lihat garis merah. Pada bunga majemuk, bunga tahun lalu ikut berbunga, jadi pertumbuhannya lebih cepat.';
 else $('fb').textContent='Pada tahun pertama memang sama, tetapi setelah itu bunga majemuk lebih besar. Lihat selisihnya.'};
const ro=new ResizeObserver(draw);ro.observe($('svg'));</script></body></html>
