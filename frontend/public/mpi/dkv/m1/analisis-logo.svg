<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Membaca makna logo (contoh karangan)"><rect width="640" height="360" rx="24" fill="#fff"/><rect width="640" height="56" rx="24" fill="#dff2e4"/><rect y="32" width="640" height="24" fill="#dff2e4"/><text x="28" y="38" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f8a4c" text-anchor="start">Membaca makna logo (contoh karangan)</text><g transform="translate(150,210) scale(1.5)"><circle r="60" fill="#1f8a4c"/><path d="M-6,38 L-6,-10 Q0,-46 6,-10 L6,38 Z" fill="#ffd23f"/><path d="M-6,-10 Q0,-46 6,-10 Z" fill="#ef5b3f"/><path d="M6,10 Q40,-6 36,-34 Q14,-26 6,0 Z" fill="#ffd23f" opacity=".9"/><path d="M-6,18 Q-40,4 -36,-24 Q-14,-16 -6,8 Z" fill="#ffd23f" opacity=".9"/></g><line x1="210" y1="115" x2="242" y2="115" stroke="#4d6655" stroke-width="2"/><text x="250" y="120" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#173020" text-anchor="start">Lingkaran: kebersamaan, utuh</text><line x1="210" y1="170" x2="242" y2="170" stroke="#4d6655" stroke-width="2"/><text x="250" y="175" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#173020" text-anchor="start">Pena: menulis, berkarya</text><line x1="210" y1="225" x2="242" y2="225" stroke="#4d6655" stroke-width="2"/><text x="250" y="230" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#173020" text-anchor="start">Daun: tumbuh, segar</text><line x1="210" y1="280" x2="242" y2="280" stroke="#4d6655" stroke-width="2"/><text x="250" y="285" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#173020" text-anchor="start">Hijau dan kuning: pondok, ceria</text></svg>