<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Tugas akhir dikumpulkan dalam CDR dan PDF"><rect width="640" height="360" rx="24" fill="#fff"/><rect width="640" height="56" rx="24" fill="#dff2e4"/><rect y="32" width="640" height="24" fill="#dff2e4"/><text x="28" y="38" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f8a4c" text-anchor="start">Tugas akhir dikumpulkan dalam CDR dan PDF</text><path d="M110 90 h110 l40 40 v170 h-150z" fill="#fff" stroke="#1f8a4c" stroke-width="4"/><path d="M220 90 v40 h40" fill="none" stroke="#1f8a4c" stroke-width="4"/><rect x="125" y="190" width="120" height="44" rx="10" fill="#1f8a4c" /><text x="185" y="220" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">.CDR</text><text x="185" y="328" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#4d6655" text-anchor="middle">file kerja, bisa diedit lagi</text><path d="M380 90 h110 l40 40 v170 h-150z" fill="#fff" stroke="#ef5b3f" stroke-width="4"/><path d="M490 90 v40 h40" fill="none" stroke="#ef5b3f" stroke-width="4"/><rect x="395" y="190" width="120" height="44" rx="10" fill="#ef5b3f" /><text x="455" y="220" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">.PDF</text><text x="455" y="328" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#4d6655" text-anchor="middle">untuk dikirim dan dicetak</text><text x="320" y="200" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#173020" text-anchor="middle">+</text></svg>