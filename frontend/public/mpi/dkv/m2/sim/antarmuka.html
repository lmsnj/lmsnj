<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peraga antarmuka CorelDRAW</title>
<style>
:root{--g:#1f8a4c;--g2:#dff2e4;--y:#ffd23f;--y2:#fff4c7;--c:#ef5b3f;--c2:#ffe3dc;--ink:#173020;--mute:#4d6655;--line:#cfe0d3;--paper:#fff}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Nunito,"Segoe UI",Arial,sans-serif}
.wrap{padding:16px;max-width:900px;margin:auto}
.goal{background:var(--y2);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.win{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-top:12px;display:none}
.win.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.big{font:800 clamp(36px,7vw,60px)/1.05 "Baloo 2",Nunito,sans-serif;color:var(--g)}.big sup{font-size:.5em;color:var(--c)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:620px){.row{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:grid;gap:2px;margin:8px 0}.ctrl label{font-weight:800;display:flex;justify-content:space-between}.ctrl output{color:var(--c);font-weight:800;font-size:20px}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:800 22px "Baloo 2",Nunito,sans-serif;min-width:46px;height:46px;padding:0 10px;border-radius:12px;display:inline-grid;place-items:center;background:var(--g2);color:var(--g)}
.chip.y{background:var(--y);color:#2b2300}.chip.c{background:var(--c);color:#fff}
.mute{color:var(--mute);font-size:15px}
svg text{font:700 14px Nunito,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}td.n{background:var(--y2);font-weight:800}
.scroll{overflow-x:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--g2);border-radius:12px;padding:4px;gap:4px}.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font:800 15px Nunito;color:var(--ink);cursor:pointer;min-height:40px}.seg button[aria-pressed=true]{background:#fff;color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="goal" id="goal">Klik bagian yang diminta pada tampilan di bawah.</div>
<p class="mute" style="margin:-4px 0 8px">Tampilan layar CorelDRAW. Klik langsung pada bagiannya.</p><div id="ui" style="position:relative;border:2px solid #cfe0d3;border-radius:10px;overflow:hidden;cursor:pointer;line-height:0"><img src="../ui-layar.png" alt="Tampilan layar CorelDRAW" style="width:100%;height:auto;display:block"><div class="hs" data-k="title" style="left:0.0%;top:0.0%;width:100.0%;height:4.6875%"></div><div class="hs" data-k="menu" style="left:0.0%;top:4.6875%;width:100.0%;height:3.75%"></div><div class="hs" data-k="std" style="left:0.0%;top:8.4375%;width:100.0%;height:5.9375%"></div><div class="hs" data-k="prop" style="left:0.0%;top:14.375%;width:100.0%;height:7.1875%"></div><div class="hs" data-k="tool" style="left:0.0%;top:21.5625%;width:4.4%;height:71.875%"></div><div class="hs" data-k="pasteboard" style="left:4.4%;top:25.625%;width:73.2%;height:65.0%"></div><div class="hs" data-k="page" style="left:21.4%;top:32.1875%;width:30.2%;height:58.4375%"></div><div class="hs" data-k="docker" style="left:77.6%;top:25.625%;width:19.6%;height:67.8125%"></div><div class="hs" data-k="pal" style="left:97.2%;top:25.625%;width:2.8%;height:67.8125%"></div><div class="hs" data-k="status" style="left:0.0%;top:93.4375%;width:100.0%;height:6.5625%"></div><div id="hl" style="position:absolute;border:4px solid #ef5b3f;border-radius:6px;pointer-events:none;display:none"></div></div><style>.hs{position:absolute}.hs:hover{background:rgba(31,138,76,.12)}</style>
<p id="fb" style="font-weight:800;min-height:2.6em;margin:8px 0 0"></p>
<div class="btns"><span class="chip" id="cnt">0/8</span></div><div class="win" id="win" role="status"></div></div><script>
/* Jembatan MPI: menerima mpi:init dari LMS, mengirim mpi:ready, mpi:resize, mpi:progress, mpi:done */
const MPI={params:{},started:false,_done:false,
 post(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}},
 done(detail){if(this._done)return;this._done=true;this.post({type:'mpi:done',detail:detail||{}})},
 progress(detail){this.post({type:'mpi:progress',detail})}};
(function(){
 const q=new URLSearchParams(location.search);q.forEach((v,k)=>{MPI.params[k]=isNaN(+v)||v===''?v:+v});
 function go(){MPI.started=true;try{window.start(MPI.params)}catch(e){console.error(e)}}
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='mpi:init'){Object.assign(MPI.params,d.params||{});MPI._done=false;go()}});
 const ro=new ResizeObserver(()=>MPI.post({type:'mpi:resize',height:Math.ceil(document.documentElement.scrollHeight)}));ro.observe(document.body);
 window.addEventListener('load',()=>{MPI.post({type:'mpi:ready'});setTimeout(()=>{if(!MPI.started)go()},400)});
})();
const $=id=>document.getElementById(id);
const fmt=n=>Number.isInteger(n)?n.toLocaleString('id-ID'):n.toLocaleString('id-ID',{maximumFractionDigits:3});
const sup=n=>'<sup>'+n+'</sup>';
function win(html){const w=$('win');w.innerHTML=html;w.classList.add('on')}
</script><script>
const PARTS={menu:['Menu Bar','berisi menu perintah: File, Edit, View, Object, dan lainnya.'],std:['Standard Toolbar','tombol cepat: dokumen baru, buka, simpan, undo, zoom, impor dan ekspor.'],prop:['Property Bar','berubah sesuai alat atau objek yang dipilih: posisi, ukuran, putaran, tebal garis.'],tool:['Toolbox','kumpulan alat menggambar: Pick, Shape, Bezier, Pen, Rectangle, Ellipse, Text, dan lainnya.'],page:['Halaman kerja (Page)','area yang akan dicetak atau diekspor. Desain utama ditaruh di sini.'],docker:['Docker (panel Properties/Objects)','panel pengaturan detail objek, warna, dan daftar objek atau layer.'],pal:['Color Palette','palet warna. Klik kiri = warna isian, klik kanan = warna garis tepi.'],status:['Status Bar','menampilkan informasi objek terpilih: jenis objek, warna isi, garis tepi, posisi kursor.']};
const OTHER={title:'Itu Title Bar (judul jendela dan nama file).',pasteboard:'Itu area abu-abu di luar halaman (pasteboard/drawing window). Objek di sini tidak ikut dicetak.'};
let order,i,ok;
function start(){order=['tool','page','menu','prop','pal','std','docker','status'];i=0;ok=0;$('win').classList.remove('on');ask()}
function ask(){if(i>=order.length){win('Kamu sudah mengenal 8 bagian antarmuka CorelDRAW. Saat praktik di lab, carilah bagian-bagian ini di layar komputermu.');MPI.done({});return}
 const[n,d]=PARTS[order[i]];$('goal').innerHTML='Klik: <b>'+n+'</b>';$('cnt').textContent=i+'/8'}
function hl(k){const g=document.querySelector('.hs[data-k='+k+']'),h=$('hl');h.style.left=g.style.left;h.style.top=g.style.top;h.style.width=g.style.width;h.style.height=g.style.height;h.style.display='block'}
$('ui').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(!g||i>=order.length)return;const k=g.dataset.k;hl(k);
 if(k===order[i]){const[n,d]=PARTS[k];$('fb').innerHTML='<span style="color:#1f8a4c">Betul!</span> <b>'+n+'</b>: '+d;i++;MPI.progress({i});ask()}
 else $('fb').innerHTML='<span style="color:#ef5b3f">Belum tepat.</span> '+(PARTS[k]?'Itu <b>'+PARTS[k][0]+'</b>, '+PARTS[k][1]:OTHER[k])+' Coba cari <b>'+PARTS[order[i]][0]+'</b>.'});</script></body></html>
