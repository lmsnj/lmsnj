<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peraga inspeksi kualitas logo</title>
<style>
:root{--g:#1f8a4c;--g2:#dff2e4;--y:#ffd23f;--y2:#fff4c7;--c:#ef5b3f;--c2:#ffe3dc;--ink:#173020;--mute:#4d6655;--line:#cfe0d3;--paper:#fff}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Nunito,"Segoe UI",Arial,sans-serif}
.wrap{padding:16px;max-width:900px;margin:auto}
.goal{background:var(--y2);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.win{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-top:12px;display:none}
.win.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.big{font:800 clamp(36px,7vw,60px)/1.05 "Baloo 2",Nunito,sans-serif;color:var(--g)}.big sup{font-size:.5em;color:var(--c)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:620px){.row{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:grid;gap:2px;margin:8px 0}.ctrl label{font-weight:800;display:flex;justify-content:space-between}.ctrl output{color:var(--c);font-weight:800;font-size:20px}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:800 22px "Baloo 2",Nunito,sans-serif;min-width:46px;height:46px;padding:0 10px;border-radius:12px;display:inline-grid;place-items:center;background:var(--g2);color:var(--g)}
.chip.y{background:var(--y);color:#2b2300}.chip.c{background:var(--c);color:#fff}
.mute{color:var(--mute);font-size:15px}
svg text{font:700 14px Nunito,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}td.n{background:var(--y2);font-weight:800}
.scroll{overflow-x:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--g2);border-radius:12px;padding:4px;gap:4px}.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font:800 15px Nunito;color:var(--ink);cursor:pointer;min-height:40px}.seg button[aria-pressed=true]{background:#fff;color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="goal" id="goal">Temukan <b>5 kekurangan</b> pada logo ini. Klik bagian yang menurutmu perlu disempurnakan.</div>
<svg id="sv" viewBox="0 0 600 420" style="width:100%;height:auto;background:#fff;border:2px solid #cfe0d3;border-radius:14px;cursor:crosshair">
<g id="bad"><g transform="translate(300 180)">
<circle r="95" fill="#009640"/>
<path d="M-20 35 L-18 20 L-10 8 L-12 2 L-2 -14 L6 -24 L4 -28 L18 -38 L30 -44 L28 -48 L45 -54 L65 -60 L62 -40 L58 -32 L60 -26 L50 -10 L44 2 L46 6 L30 20 L18 26 L20 30 Z" fill="#ffed00"/>
<path d="M-55 85 L-42 52 L22 -42 L38 -31 L-25 62 Z" fill="#fff" stroke="#000" stroke-width="1"/><path d="M22 -42 L38 -31 L30 -48Z" fill="#e30613"/>
<path d="M-62 86 L-55 85 L-53 99 Z" fill="#fff"/>
<circle cx="-70" cy="-40" r="16" fill="#8e24aa"/>
<circle r="95" fill="none" stroke="#006b2d" stroke-width="7" stroke-dasharray="300 600"/>
</g><text x="330" y="330" text-anchor="middle" style="font:800 30px 'Segoe UI',Arial,sans-serif;fill:#009640;stroke:none">PEKAN KREASI SANTRI</text></g>
<g id="good" style="display:none"><g transform="translate(300 180)"><circle cx="0" cy="0" r="95" fill="#009640"/><path d="M-20 35 C-20 -20 15 -52 65 -60 C62 -5 30 30 -20 35Z" fill="#ffed00"/><path d="M-55 85 L-42 52 L22 -42 L38 -31 L-25 62 Z" fill="#fff"/><path d="M22 -42 L38 -31 L30 -48Z" fill="#e30613"/></g><text x="300" y="330" text-anchor="middle" style="font:800 30px 'Segoe UI',Arial,sans-serif;fill:#009640;stroke:none">PEKAN KREASI SANTRI</text></g>
<g id="mk"></g></svg>
<p id="fb" style="font-weight:800;min-height:2.6em;margin:8px 0 0"></p>
<div class="btns"><span class="chip" id="cnt">0/5</span><button class="btn ghost" id="tg" style="display:none">Lihat sesudah disempurnakan</button></div><div class="win" id="win" role="status"></div></div><script>
/* Jembatan MPI: menerima mpi:init dari LMS, mengirim mpi:ready, mpi:resize, mpi:progress, mpi:done */
const MPI={params:{},started:false,_done:false,
 post(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}},
 done(detail){if(this._done)return;this._done=true;this.post({type:'mpi:done',detail:detail||{}})},
 progress(detail){this.post({type:'mpi:progress',detail})}};
(function(){
 const q=new URLSearchParams(location.search);q.forEach((v,k)=>{MPI.params[k]=isNaN(+v)||v===''?v:+v});
 function go(){MPI.started=true;try{window.start(MPI.params)}catch(e){console.error(e)}}
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='mpi:init'){Object.assign(MPI.params,d.params||{});MPI._done=false;go()}});
 const ro=new ResizeObserver(()=>MPI.post({type:'mpi:resize',height:Math.ceil(document.documentElement.scrollHeight)}));ro.observe(document.body);
 window.addEventListener('load',()=>{MPI.post({type:'mpi:ready'});setTimeout(()=>{if(!MPI.started)go()},400)});
})();
const $=id=>document.getElementById(id);
const fmt=n=>Number.isInteger(n)?n.toLocaleString('id-ID'):n.toLocaleString('id-ID',{maximumFractionDigits:3});
const sup=n=>'<sup>'+n+'</sup>';
function win(html){const w=$('win');w.innerHTML=html;w.classList.add('on')}
</script><script>
const F=[{x:340,y:150,r:45,t:'Tepi daun <b>bergerigi</b> karena node terlalu banyak. Kurangi node dan gunakan node Smooth.'},
 {x:242,y:268,r:26,t:'Ada <b>serpihan dan celah kecil</b> di ujung pena yang keluar dari lingkaran. Hapus serpihan dan rapatkan objek.'},
 {x:330,y:320,r:40,t:'Teks <b>tidak sejajar di tengah</b> simbol. Pilih teks dan simbol, lalu Align Centers Vertically (C).'},
 {x:230,y:140,r:28,t:'Warna ungu <b>di luar konsep</b>. Logo cukup memakai warna dari kata kunci: hijau, kuning, dan aksen merah.'},
 {x:375,y:105,r:40,t:'<b>Garis tepi tidak konsisten</b>: hanya separuh lingkaran yang punya garis tebal. Hapus atau buat seragam.'}];
let found;
function start(){found=new Set();$('mk').innerHTML='';$('fb').textContent='';$('cnt').textContent='0/5';$('tg').style.display='none';$('bad').style.display='';$('good').style.display='none';$('win').classList.remove('on')}
function P(e){const m=$('sv').getScreenCTM().inverse(),q=$('sv').createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(m)}
$('sv').addEventListener('click',e=>{if(found.size===5)return;const p=P(e);let hit=-1;F.forEach((f,i)=>{if(Math.hypot(p.x-f.x,p.y-f.y)<f.r)hit=i});
 if(hit<0){$('fb').innerHTML='<span style="color:#4d6655">Bagian ini sudah cukup rapi. Cari yang lain.</span>';return}
 if(found.has(hit)){$('fb').innerHTML='Itu sudah ditemukan. Cari kekurangan lainnya.';return}
 found.add(hit);const f=F[hit];$('mk').innerHTML+=`<circle cx="${f.x}" cy="${f.y}" r="${f.r}" fill="none" stroke="#ef5b3f" stroke-width="4"/><text x="${f.x}" y="${f.y-f.r-6}" text-anchor="middle" style="fill:#ef5b3f">${found.size}</text>`;
 $('fb').innerHTML='<span style="color:#1f8a4c">Ketemu!</span> '+f.t;$('cnt').textContent=found.size+'/5';MPI.progress({found:found.size});
 if(found.size===5){$('tg').style.display='';win('Lima kekurangan ditemukan: node bergerigi, serpihan dan celah, teks tidak di tengah, warna di luar konsep, dan garis tepi tidak konsisten. Inilah daftar periksa saat menyempurnakan logomu. Klik tombol untuk melihat versi yang sudah disempurnakan.');MPI.done({})}});
$('tg').onclick=()=>{const g=$('good').style.display==='none';$('good').style.display=g?'':'none';$('bad').style.display=g?'none':'';$('mk').style.display=g?'none':'';$('tg').textContent=g?'Lihat sebelum':'Lihat sesudah disempurnakan'};</script></body></html>
