<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Pangkat = perkalian yang diulang"><rect width="640" height="360" rx="24" fill="#ffffff"/><rect x="0" y="0" width="640" height="56" rx="24" fill="#dff2e4"/><rect x="0" y="32" width="640" height="24" fill="#dff2e4"/><text x="28" y="38" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f8a4c">Pangkat = perkalian yang diulang</text><rect x="22" y="110" width="96" height="80" rx="18" fill="#ffd23f"/><text x="70" y="163" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#2b2300" text-anchor="middle">2</text><text x="135" y="158" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#4d6655" text-anchor="middle">×2</text><rect x="152" y="110" width="96" height="80" rx="18" fill="#1f8a4c"/><text x="200" y="163" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="265" y="158" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#4d6655" text-anchor="middle">×2</text><rect x="282" y="110" width="96" height="80" rx="18" fill="#1f8a4c"/><text x="330" y="163" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="395" y="158" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#4d6655" text-anchor="middle">×2</text><rect x="412" y="110" width="96" height="80" rx="18" fill="#1f8a4c"/><text x="460" y="163" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">16</text><text x="525" y="158" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#4d6655" text-anchor="middle">×2</text><rect x="542" y="110" width="96" height="80" rx="18" fill="#ef5b3f"/><text x="590" y="163" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">32</text><text x="320" y="250" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#1f8a4c" text-anchor="middle">2⁵ = 2 × 2 × 2 × 2 × 2 = 32</text><text x="320" y="300" font-family="Nunito,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#4d6655" text-anchor="middle">basis 2 dikalikan 5 kali, bukan 2 × 5</text></svg>