<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peraga deret tak hingga</title>
<style>
:root{--g:#1f8a4c;--g2:#dff2e4;--y:#ffd23f;--y2:#fff4c7;--c:#ef5b3f;--c2:#ffe3dc;--ink:#173020;--mute:#4d6655;--line:#cfe0d3;--paper:#fff}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Nunito,"Segoe UI",Arial,sans-serif}
.wrap{padding:16px;max-width:900px;margin:auto}
.goal{background:var(--y2);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.win{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-top:12px;display:none}
.win.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.big{font:800 clamp(36px,7vw,60px)/1.05 "Baloo 2",Nunito,sans-serif;color:var(--g)}.big sup{font-size:.5em;color:var(--c)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:620px){.row{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:grid;gap:2px;margin:8px 0}.ctrl label{font-weight:800;display:flex;justify-content:space-between}.ctrl output{color:var(--c);font-weight:800;font-size:20px}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:800 22px "Baloo 2",Nunito,sans-serif;min-width:46px;height:46px;padding:0 10px;border-radius:12px;display:inline-grid;place-items:center;background:var(--g2);color:var(--g)}
.chip.y{background:var(--y);color:#2b2300}.chip.c{background:var(--c);color:#fff}
.mute{color:var(--mute);font-size:15px}
svg text{font:700 14px Nunito,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}td.n{background:var(--y2);font-weight:800}
.scroll{overflow-x:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--g2);border-radius:12px;padding:4px;gap:4px}.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font:800 15px Nunito;color:var(--ink);cursor:pointer;min-height:40px}.seg button[aria-pressed=true]{background:#fff;color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="goal" id="goal">Kertas persegi = 1. Ambil setengahnya, lalu setengah dari sisanya, dan seterusnya. Klik "Tambah potongan" dan perhatikan jumlahnya.</div>
<div class="row"><div><div style="position:relative;height:300px"><svg id="svg" viewBox="0 0 300 300" style="position:absolute;inset:0;width:100%;height:100%" role="img" aria-label="Persegi yang terisi potongan setengah, seperempat, dan seterusnya"></svg></div>
<div class="btns"><button class="btn" id="add">Tambah potongan</button><button class="btn ghost" id="reset">Ulang</button></div></div>
<div><div class="big" id="sum" style="font-size:clamp(22px,3.8vw,32px)"></div><p id="ex" style="font-weight:800"></p><p class="mute" id="sisa"></p>
<div id="q" style="display:none;background:#dff2e4;border-radius:14px;padding:12px 14px"><b>Jika potongannya ditambah terus tanpa henti, jumlahnya ...</b>
<div class="btns" id="opts"><button class="btn ghost" data-k="inf">menjadi tak terhingga</button><button class="btn ghost" data-k="one">mendekati 1</button><button class="btn ghost" data-k="two">tepat 2</button></div><p id="fb" style="margin:8px 0 0"></p></div></div></div><div class="win" id="win" role="status"></div></div><script>
/* Jembatan MPI: menerima mpi:init dari LMS, mengirim mpi:ready, mpi:resize, mpi:progress, mpi:done */
const MPI={params:{},started:false,_done:false,
 post(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}},
 done(detail){if(this._done)return;this._done=true;this.post({type:'mpi:done',detail:detail||{}})},
 progress(detail){this.post({type:'mpi:progress',detail})}};
(function(){
 const q=new URLSearchParams(location.search);q.forEach((v,k)=>{MPI.params[k]=isNaN(+v)||v===''?v:+v});
 function go(){MPI.started=true;try{window.start(MPI.params)}catch(e){console.error(e)}}
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='mpi:init'){Object.assign(MPI.params,d.params||{});MPI._done=false;go()}});
 const ro=new ResizeObserver(()=>MPI.post({type:'mpi:resize',height:Math.ceil(document.documentElement.scrollHeight)}));ro.observe(document.body);
 window.addEventListener('load',()=>{MPI.post({type:'mpi:ready'});setTimeout(()=>{if(!MPI.started)go()},400)});
})();
const $=id=>document.getElementById(id);
const fmt=n=>Number.isInteger(n)?n.toLocaleString('id-ID'):n.toLocaleString('id-ID',{maximumFractionDigits:3});
const sup=n=>'<sup>'+n+'</sup>';
function win(html){const w=$('win');w.innerHTML=html;w.classList.add('on')}
</script><script>
let k=0;const C=['#1f8a4c','#ffd23f','#ef5b3f','#2f9e64','#f2b705','#e67a5f','#57b97f','#ffe07a','#f29a85','#9ed8b4','#fff0b3','#fbd0c6'];
function draw(){let g='<rect x="10" y="10" width="280" height="280" fill="#ffffff" stroke="#cfe0d3" stroke-width="2"/>',x=10,y=10,w=280,h=280;
 for(let i=0;i<k;i++){if(i%2===0){const hw=w/2;g+='<rect x="'+x+'" y="'+y+'" width="'+hw+'" height="'+h+'" fill="'+C[i%C.length]+'" stroke="#fff" stroke-width="2"/>';if(i<5)g+='<text x="'+(x+hw/2)+'" y="'+(y+h/2+5)+'" text-anchor="middle">1/'+2**(i+1)+'</text>';x+=hw;w=hw}
  else{const hh=h/2;g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" fill="'+C[i%C.length]+'" stroke="#fff" stroke-width="2"/>';if(i<5)g+='<text x="'+(x+w/2)+'" y="'+(y+hh/2+5)+'" text-anchor="middle">1/'+2**(i+1)+'</text>';y+=hh;h=hh}}
 $('svg').innerHTML=g}
function upd(){const S=1-1/2**k;draw();$('sum').innerHTML='S<sub>'+k+'</sub> = '+(k?fmt(Math.round(S*100000)/100000):'0');
 $('ex').innerHTML=k?Array.from({length:Math.min(k,4)},(_,i)=>'1/'+2**(i+1)).join(' + ')+(k>4?' + ... + 1/'+fmt(2**k):''):'Belum ada potongan.';
 $('sisa').textContent=k?'Bagian yang belum terisi tinggal 1/'+fmt(2**k)+' dari kertas.':'';$('add').disabled=k>=12;if(k>=6)$('q').style.display='block';MPI.progress({pieces:k})}
function start(p){k=0;$('q').style.display='none';$('fb').textContent='';$('win').classList.remove('on');upd()}
$('add').onclick=()=>{if(k<12){k++;upd()}};$('reset').onclick=()=>{k=0;upd()};
$('opts').onclick=e=>{const c=e.target.dataset.k;if(!c)return;
 if(c==='one'){$('fb').innerHTML='<b>Betul!</b>';win('Potongannya tidak pernah melebihi kertas utuh, jadi jumlahnya mendekati 1. Ini deret geometri tak hingga yang konvergen: S<sub>∞</sub> = a/(1 − r) = ½ : (1 − ½) = 1. Konvergen hanya terjadi jika −1 &lt; r &lt; 1.');MPI.done({choice:c})}
 else if(c==='inf')$('fb').textContent='Potongannya memang tak terhingga banyaknya, tetapi makin lama makin kecil dan tidak pernah keluar dari kertas. Lihat bagian yang belum terisi.';
 else $('fb').textContent='Semua potongan berasal dari satu kertas utuh, jadi jumlahnya tidak mungkin melebihi 1.'};</script></body></html>
