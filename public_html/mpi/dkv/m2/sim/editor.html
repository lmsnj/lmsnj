<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Logo Mini</title>
<style>
:root{--g:#1f8a4c;--g2:#dff2e4;--y:#ffd23f;--y2:#fff4c7;--c:#ef5b3f;--ink:#173020;--mute:#4d6655;--line:#cfe0d3;--ui:#eef1ef;--ui2:#dfe4e1}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.4 Nunito,"Segoe UI",Arial,sans-serif}
.wrap{padding:10px;max-width:1000px;margin:auto}
.mis{background:var(--y2);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.mis h3{margin:0 0 4px;font-size:16px}
.mis ul{margin:4px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 12px}
.mis li{font-weight:700}.mis li:before{content:"☐ ";color:var(--mute)}.mis li.ok{color:var(--g)}.mis li.ok:before{content:"☑ ";color:var(--g)}
.app{border:2px solid var(--ui2);border-radius:12px;overflow:hidden;background:var(--ui)}

.prop .lbl{font-size:12px;color:var(--mute);font-weight:800;margin:0 2px 0 6px}
.prop button,.prop select,.prop input{font:700 13px Nunito,sans-serif;border:1px solid var(--ui2);background:#fff;border-radius:7px;padding:5px 8px;min-height:32px;cursor:pointer;color:var(--ink)}
.prop button:hover{background:var(--g2)}.prop button.on{background:var(--g);color:#fff;border-color:var(--g)}
.prop input[type=text]{width:170px;cursor:text}
.sw{width:26px;height:26px;border-radius:6px;border:2px solid #999;display:inline-block;vertical-align:middle;background:#fff}
.sw.none{background:linear-gradient(45deg,#fff 45%,#e53935 45%,#e53935 55%,#fff 55%)}
.mid{display:grid;grid-template-columns:50px minmax(0,1fr) 34px}
.tools{display:flex;flex-direction:column;gap:3px;padding:5px;background:#f7f9f8;border-right:1px solid var(--ui2)}
.tools button{width:40px;height:40px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.tools button:hover{background:var(--g2)}.tools button.on{background:var(--g2);border-color:var(--g)}
.tools svg{width:24px;height:24px}
.stage{position:relative;background:#c9cfcb;touch-action:none}
#cv{display:block;width:100%;height:auto;max-height:560px;user-select:none;-webkit-user-select:none}
.pal{display:flex;flex-direction:column;gap:2px;padding:3px;background:#f7f9f8;border-left:1px solid var(--ui2)}
.pal button{width:26px;height:22px;border:1px solid #888;border-radius:4px;cursor:pointer;padding:0}
.stat{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 10px;font-size:13px;background:#f7f9f8;border-top:1px solid var(--ui2);color:var(--mute)}
.stat b{color:var(--ink)}
.msg{margin-top:8px;border-radius:12px;padding:8px 12px;font-weight:700;display:none}
.msg.on{display:block}.msg.info{background:var(--g2)}.msg.warn{background:#ffe3dc}.msg.good{background:var(--g);color:#fff}
.btn{border:0;border-radius:10px;padding:8px 14px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:40px;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button:focus-visible{outline:3px solid var(--c);outline-offset:1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:9;padding:16px}
.ov.on{display:grid}.ov .box{background:#fff;border-radius:14px;padding:14px;max-width:520px;width:100%}
.ov img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
@media(max-width:640px){.mid{grid-template-columns:minmax(0,1fr)}.tools{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--ui2)}.pal{flex-direction:row;flex-wrap:wrap;border-left:0;border-top:1px solid var(--ui2)}}

<div class="ov" id="ov"><div class="box"><b>Hasil logomu</b><p class="mute" id="ovt" style="margin:4px 0 8px;font-size:14px"></p><img id="ovimg" alt="Hasil logo"><div class="btns"><a class="btn" id="ovdl" download="logo-saya.png" href="#">Unduh PNG</a><a class="btn ghost" id="ovsvg" download="logo-saya.svg" href="#">Unduh SVG</a><button class="btn ghost" id="ovx">Tutup</button></div></div></div>
</div>
<script>
/* Jembatan MPI: menerima mpi:init dari LMS, mengirim mpi:ready, mpi:resize, mpi:progress, mpi:done */
const MPI={params:{},started:false,_done:false,
 post(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}},
 done(detail){if(this._done)return;this._done=true;this.post({type:'mpi:done',detail:detail||{}})},
 progress(detail){this.post({type:'mpi:progress',detail})}};
(function(){
 const q=new URLSearchParams(location.search);q.forEach((v,k)=>{MPI.params[k]=isNaN(+v)||v===''?v:+v});
 function go(){MPI.started=true;try{window.start(MPI.params)}catch(e){console.error(e)}}
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='mpi:init'){Object.assign(MPI.params,d.params||{});MPI._done=false;go()}});
 const ro=new ResizeObserver(()=>MPI.post({type:'mpi:resize',height:Math.ceil(document.documentElement.scrollHeight)}));ro.observe(document.body);
 window.addEventListener('load',()=>{MPI.post({type:'mpi:ready'});setTimeout(()=>{if(!MPI.started)go()},400)});
})();
const $=id=>document.getElementById(id);
const fmt=n=>Number.isInteger(n)?n.toLocaleString('id-ID'):n.toLocaleString('id-ID',{maximumFractionDigits:3});
const sup=n=>'<sup>'+n+'</sup>';
function win(html){const w=$('win');w.innerHTML=html;w.classList.add('on')}
</script>

 e.style.cursor=tool==='pick'?'move':'default'});renderOv();updProp();check()}

function renderOv(){OV.innerHTML='';const k=px(),o=S();

function sketchURL(){const g=(d,o)=>`<path d="${d}" fill="none" stroke="#555" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="${o}" opacity=".9"/><path d="${d}" fill="none" stroke="#777" stroke-width="1.2" transform="translate(1.6 -1.2)" opacity=".7"/>`;
 const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">${g(LOGO.ring,'14 3 30 2')}${g(LOGO.leaf,'20 3')}${g('M195 170 C220 150 250 125 285 108','8 4')}${g(LOGO.pen,'18 2 9 3')}<text x="200" y="382" font-family="Comic Sans MS,cursive" font-size="22" fill="#666" text-anchor="middle">pekan kreasi santri</text><text x="345" y="40" font-family="Comic Sans MS,cursive" font-size="13" fill="#999" text-anchor="middle">sketsa #2</text></svg>`;
 return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
function grayLogo(){const mk=(d,extra)=>{const o={id:uid++,t:'path',nodes:parseD(d),closed:true,fill:GRAY,stroke:'#555555',sw:1,preset:true};return Object.assign(o,extra||{})};
 const ring={id:uid++,t:'ell',cx:200,cy:190,rx:150,ry:150,fill:GRAY,stroke:'#555555',sw:1,part:'Lingkaran'};
 return[ring,mk(LOGO.leaf,{part:'Daun'}),mk(LOGO.pen,{part:'Pena'}),{id:uid++,t:'text',x:200,y:378,txt:'PEKAN KREASI SANTRI',size:26,font:'sans',fill:GRAY,stroke:null,sw:1,part:'Teks'}]}
function parseD(d){const t=d.match(/[MLCZ]|-?\d+(\.\d+)?/g),n=[];let i=0;while(i<t.length){const c=t[i++];if(c==='M'||c==='L'){n.push({x:+t[i],y:+t[i+1],hi:null,ho:null,type:'cusp'});i+=2}else if(c==='C'){const a=n[n.length-1];a.ho=P(+t[i],+t[i+1]);const nn={x:+t[i+4],y:+t[i+5],hi:P(+t[i+2],+t[i+3]),ho:null,type:'cusp'};i+=6;if(Math.hypot(nn.x-n[0].x,nn.y-n[0].y)<.01&&n.length>1){n[0].hi=nn.hi}else n.push(nn)}else if(c==='Z'){}}
 const L=n[n.length-1];if(n.length>1&&Math.hypot(L.x-n[0].x,L.y-n[0].y)<.01){n[0].hi=L.hi;n.pop()}return n}
function wobbly(d,k){/* path kasar banyak node dari bentuk target */const sv=el('path',{d},OV);const len=sv.getTotalLength(),nodes=[];for(let i=0;i<k;i++){const q=sv.getPointAtLength(len*i/k),j=i%2?9:-8;nodes.push({x:q.x+j*.8,y:q.y-j*.6,hi:null,ho:null,type:'cusp'})}sv.remove();return nodes}
function hue(c){if(!c)return-1;const n=parseInt(c.slice(1),16),R=(n>>16)/255,Gg=(n>>8&255)/255,B=(n&255)/255,mxv=Math.max(R,Gg,B),mn=Math.min(R,Gg,B),d=mxv-mn;if(d<.15)return-1;let h=mxv===R?((Gg-B)/d)%6:mxv===Gg?(B-R)/d+2:(R-Gg)/d+4;h*=60;return h<0?h+360:h}
function drawTarget(d){TG.innerHTML='';if(d)el('path',{d,fill:'#ffd23f',opacity:.28,stroke:'#b8860b','stroke-width':2,'stroke-dasharray':'7 5'},TG)}
const MIS={
 bentuk:{judul:'Misi: Kenalan dengan tools dasar',init(){},items:[
  ['Buat persegi panjang (Rectangle Tool)',()=>flags.rect],['Buat elips atau lingkaran (Ellipse Tool)',()=>flags.ell],['Beri warna isian (klik kiri palet)',()=>O.some(o=>o.fill&&o.t!=='img')],
  ['Beri warna/tebal garis tepi (klik kanan palet)',()=>flags.outline],['Duplikat sebuah objek (Ctrl+D)',()=>flags.dup],['Ubah ke kurva (Ctrl+Q), lalu geser satu node dengan Shape Tool',()=>flags.curve&&flags.nodemove]],
  win:'Hebat! Kamu sudah memakai Rectangle, Ellipse, palet warna, Duplikat, Convert to Curves, dan Shape Tool. Di CorelDRAW caranya sama persis.'},
 jiplak:{judul:'Misi: Jiplak bentuk dengan Bezier/Pen',init(){this.lv=0;this.levels=(M.p.levels||'segitiga,tetes,daun').split(',');this.show()},
  show(){const s=SH[this.levels[this.lv]];drawTarget(s.d);O=O.filter(o=>o.t==='img');sel=null;setTool(M.p.tool||'bezier');say(`<b>Level ${this.lv+1}/${this.levels.length}: ${s.nm}.</b> ${s.tip} Jiplak area kuning bergaris putus-putus, lalu klik <b>Periksa</b>.`,'info');this.score=0},
  items:[],extra(){return'<button class="btn" id="cek">Periksa</button>'},
  cek(){const s=SH[this.levels[this.lv]];const[v,o]=bestFit(s.d,o=>o.t==='path'&&(o.src==='bezier'||o.src==='pen'));const pc=Math.round(v*100);
   if(!o){say('Belum ada kurva dari Bezier atau Pen Tool. Pilih alat Bezier/Pen, lalu klik di sudut-sudut bentuk.','warn');return}
   if(!o.closed){say(`Kemiripan ${pc}%. Path-mu belum tertutup. Akhiri dengan mengklik node kuning pertama.`,'warn');return}
   if(v<s.min){say(`Kemiripan <b>${pc}%</b> (target ${Math.round(s.min*100)}%). Rapikan dengan Shape Tool: geser node atau tuas birunya. ${s.tip}`,'warn');return}
   const nn=o.nodes.length,adv=nn>12?' Tapi node-mu '+nn+' buah. Desainer profesional memakai node sesedikit mungkin agar garis halus.':' Jumlah node: '+nn+'. Rapi!';
   this.lv++;if(this.lv<this.levels.length){say(`<b>Lulus! Kemiripan ${pc}%.</b>${adv} Lanjut level berikutnya…`,'good');setTimeout(()=>this.show(),1600)}else{drawTarget(null);finish(`Semua level lulus (terakhir ${pc}%).${adv} Kamu sudah bisa menjiplak bentuk lurus dan lengkung, inti dari digitalisasi logo.`)}}},
 rapikan:{judul:'Misi: Rapikan hasil tracing yang kasar',init(){const s=SH[M.p.target||'tetes'];drawTarget(s.d);const o={id:uid++,t:'path',nodes:wobbly(s.d,14),closed:true,fill:null,stroke:'#1f8a4c',sw:3,src:'trace'};O.push(o);sel=o.id;setTool('shape');say('Ini hasil tracing yang terburu-buru: 14 node dan garisnya bergerigi. Kurangi node (klik node lalu <b>Hapus node</b>, atau klik ganda node), lalu jadikan node <b>Smooth</b> dan atur tuasnya sampai pas.','info')},
  items:[['Jumlah node 6 atau kurang',()=>{const o=O.find(o=>o.src==='trace');return o&&o.nodes.length<=6}],['Ada node yang dibuat Smooth/Symmetrical',()=>flags.nodetype],['Bentuk tetap mirip target (minimal 86%)',()=>{const o=O.find(o=>o.src==='trace');return o&&iou(mask([SH[M.p.target||'tetes'].d]),mask([toD(o)]))>=.86}]],
  stat(){const o=O.find(o=>o.src==='trace');return o?'Kemiripan: <b>'+Math.round(iou(mask([SH[M.p.target||'tetes'].d]),mask([toD(o)]))*100)+'%</b>':''},
  win:'Rapi! Sedikit node + node halus = garis mulus dan file ringan. Inilah yang membedakan logo profesional dengan hasil tracing asal-asalan.'},
 warna:{judul:'Misi: Warnai logo sesuai konsep',init(){O=grayLogo();setTool('pick');say('Konsep logo <b>Pekan Kreasi Santri</b>: kata kunci <b>segar, ceria, santri</b>. Pakai <b>hijau</b> dan <b>kuning</b> sebagai warna utama, boleh tambah 1 warna aksen, maksimal 3 warna (putih tidak dihitung). Pilih bagian dengan Pick Tool, lalu klik palet.','info')},
  items:[['Semua bagian sudah diwarnai (tidak abu-abu)',()=>O.filter(o=>o.part).every(o=>o.fill&&o.fill!==GRAY)],['Ada warna hijau',()=>O.some(o=>o.part&&hue(o.fill)>=75&&hue(o.fill)<=170)],['Ada warna kuning',()=>O.some(o=>o.part&&hue(o.fill)>=40&&hue(o.fill)<75)],['Maksimal 3 warna (putih tidak dihitung)',()=>new Set(O.filter(o=>o.part&&o.fill&&o.fill!=='#ffffff'&&o.fill!==GRAY).map(o=>o.fill)).size<=3]],
  win:'Warna sesuai konsep: hijau = segar dan santri, kuning = ceria. Dengan maksimal 3 warna, logo tetap tegas dan hemat saat dicetak.'},
 logo:{judul:'Misi: Digitalisasi logo dari sketsa',init(){O=[{id:uid++,t:'img',href:sketchURL(),x:14,y:10,w:380,h:380,op:.6,lock:false,sk:true}];sel=O[0].id;setTool('pick');say('Sketsa sudah dimasukkan (seperti <b>Import</b>, Ctrl+I di CorelDRAW), dan sudah diatur ukuran serta posisinya. Langkah 1: kunci sketsa dulu (pilih sketsa, klik <b>🔒 Kunci</b>). Lalu jiplak lingkaran, daun, dan pena satu per satu.','info')},
  items:[['Sketsa dikunci (🔒)',()=>O.some(o=>o.sk&&o.lock)],['Lingkaran luar dijiplak (Ellipse, tahan Ctrl)',()=>bestFit(LOGO.ring,null,skBox())[0]>=.85],['Daun dijiplak dengan Bezier/Pen',()=>bestFit(LOGO.leaf,o=>o.t==='path',skBox())[0]>=.66],['Pena dijiplak dengan Bezier/Pen',()=>bestFit(LOGO.pen,o=>o.t==='path',skBox())[0]>=.66],['Tambahkan teks nama kegiatan',()=>O.some(o=>o.t==='text'&&o.txt.trim().length>3)]],
  extraItems(){return M.p.warna?[['Warnai dengan maksimal 3 warna',()=>{const f=O.filter(o=>o.t!=='img'&&o.fill);return f.length>=3&&new Set(f.map(o=>o.fill).filter(c=>c!=='#ffffff')).size<=3}]]:[]},
  win:'Logo berhasil didigitalkan dari sketsa! Tahapnya sama dengan di CorelDRAW: import sketsa, kunci, jiplak per bagian, rapikan, beri warna. Tekan Unduh untuk menyimpan hasilmu.'},
 bebas:{judul:'Studio bebas: rancang logomu sendiri',init(){say('Rancang logo pilihanmu. Boleh pasang foto sketsamu sendiri lewat tombol <b>Pasang sketsa</b>. Selesai jika minimal ada 3 objek berwarna dan 1 teks, lalu klik <b>Unduh</b>.','info')},
  items:[['Minimal 3 objek berwarna',()=>O.filter(o=>o.t!=='img'&&o.t!=='text'&&o.fill).length>=3],['Ada kurva dari Bezier/Pen',()=>O.some(o=>o.src==='bezier'||o.src==='pen')],['Ada teks',()=>O.some(o=>o.t==='text')],['Hasil diunduh',()=>flags.export]],
  win:'Logomu selesai! Simpan file PNG/SVG-nya dan kumpulkan. Selanjutnya buat versi akhirnya di CorelDRAW di lab, simpan sebagai .CDR dan .PDF.'}};
function finish(t){if(doneSent)return;doneSent=true;say('<b>Misi selesai!</b> '+t,'good');MPI.done({mission:M.k})}
function items(){return M.m.items.concat(M.m.extraItems?M.m.extraItems():[])}
function check(){if(!M)return;const it=items();if(!it.length){return}let ok=0;const lis=$('mis').querySelectorAll('li');it.forEach(([t,f],i)=>{let v=false;try{v=!!f()}catch(e){}if(v)ok++;if(lis[i])lis[i].classList.toggle('ok',v)});
 if(M.m.stat)$('st2').innerHTML+=' · '+M.m.stat();MPI.progress({ok,total:it.length});if(ok===it.length&&!doneSent)finish(M.m.win)}
function start(p){p=p||{};const k=MIS[p.mission]?p.mission:'bebas';M={k,m:MIS[k],p};O=[];undo=[];redo=[];flags={};sel=null;doneSent=false;sketchHidden=false;drawTarget(null);$('msg').className='msg';
 $('mis').innerHTML=`<h3>${p.judul||M.m.judul}</h3>`+(M.m.items.length||M.m.extraItems?'<ul>'+items().map(([t])=>`<li>${t}</li>`).join('')+'</ul>':'');
 $('act').innerHTML=(M.m.extra?M.m.extra():'')+'<button class="btn ghost" id="exp">Unduh hasil (PNG/SVG)</button><button class="btn ghost" id="rst">Mulai ulang misi</button>';
 if($('cek'))$('cek').onclick=()=>M.m.cek();$('exp').onclick=exportArt;$('rst').onclick=()=>start(p);
 setTool('pick');M.m.init.call(M.m);if(M.m.items.length||M.m.extraItems)$('mis').querySelector('ul').innerHTML=items().map(([t])=>`<li>${t}</li>`).join('');render()}
</script></body></html>
