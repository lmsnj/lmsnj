<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peraga ekspor format file</title>
<style>
:root{--g:#1f8a4c;--g2:#dff2e4;--y:#ffd23f;--y2:#fff4c7;--c:#ef5b3f;--c2:#ffe3dc;--ink:#173020;--mute:#4d6655;--line:#cfe0d3;--paper:#fff}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Nunito,"Segoe UI",Arial,sans-serif}
.wrap{padding:16px;max-width:900px;margin:auto}
.goal{background:var(--y2);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.win{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-top:12px;display:none}
.win.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.big{font:800 clamp(36px,7vw,60px)/1.05 "Baloo 2",Nunito,sans-serif;color:var(--g)}.big sup{font-size:.5em;color:var(--c)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:620px){.row{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:grid;gap:2px;margin:8px 0}.ctrl label{font-weight:800;display:flex;justify-content:space-between}.ctrl output{color:var(--c);font-weight:800;font-size:20px}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:800 22px "Baloo 2",Nunito,sans-serif;min-width:46px;height:46px;padding:0 10px;border-radius:12px;display:inline-grid;place-items:center;background:var(--g2);color:var(--g)}
.chip.y{background:var(--y);color:#2b2300}.chip.c{background:var(--c);color:#fff}
.mute{color:var(--mute);font-size:15px}
svg text{font:700 14px Nunito,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}td.n{background:var(--y2);font-weight:800}
.scroll{overflow-x:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--g2);border-radius:12px;padding:4px;gap:4px}.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font:800 15px Nunito;color:var(--ink);cursor:pointer;min-height:40px}.seg button[aria-pressed=true]{background:#fff;color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="goal" id="goal"></div>
<div class="row"><div>
<div class="seg" id="fmt" style="margin-bottom:8px"><button data-v="cdr">CDR</button><button data-v="pdf">PDF</button><button data-v="png">PNG</button><button data-v="jpg">JPG</button></div>
<div id="opts" style="display:none"><div class="ctrl"><label>Resolusi</label><div class="seg" id="dpi"><button data-v="72">72 dpi</button><button data-v="150">150 dpi</button><button data-v="300">300 dpi</button></div></div>
<label id="trl" style="font-weight:800;display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="tr" style="width:22px;height:22px"> Latar transparan</label></div>
<button class="btn" id="go">Ekspor</button><p id="fb" style="font-weight:800;min-height:3em"></p><span class="chip" id="cnt">1/5</span></div>
<div><div id="pv" style="border-radius:14px;min-height:260px;display:grid;place-items:center;overflow:hidden;position:relative"></div><p class="mute" id="pc"></p></div></div><div class="win" id="win" role="status"></div></div><script>
/* Jembatan MPI: menerima mpi:init dari LMS, mengirim mpi:ready, mpi:resize, mpi:progress, mpi:done */
const MPI={params:{},started:false,_done:false,
 post(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}},
 done(detail){if(this._done)return;this._done=true;this.post({type:'mpi:done',detail:detail||{}})},
 progress(detail){this.post({type:'mpi:progress',detail})}};
(function(){
 const q=new URLSearchParams(location.search);q.forEach((v,k)=>{MPI.params[k]=isNaN(+v)||v===''?v:+v});
 function go(){MPI.started=true;try{window.start(MPI.params)}catch(e){console.error(e)}}
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='mpi:init'){Object.assign(MPI.params,d.params||{});MPI._done=false;go()}});
 const ro=new ResizeObserver(()=>MPI.post({type:'mpi:resize',height:Math.ceil(document.documentElement.scrollHeight)}));ro.observe(document.body);
 window.addEventListener('load',()=>{MPI.post({type:'mpi:ready'});setTimeout(()=>{if(!MPI.started)go()},400)});
})();
const $=id=>document.getElementById(id);
const fmt=n=>Number.isInteger(n)?n.toLocaleString('id-ID'):n.toLocaleString('id-ID',{maximumFractionDigits:3});
const sup=n=>'<sup>'+n+'</sup>';
function win(html){const w=$('win');w.innerHTML=html;w.classList.add('on')}
</script><script>
const LOGO='<circle cx="0" cy="0" r="95" fill="#009640"/><path d="M-20 35 C-20 -20 15 -52 65 -60 C62 -5 30 30 -20 35Z" fill="#ffed00"/><path d="M-55 85 L-42 52 L22 -42 L38 -31 L-25 62 Z" fill="#fff"/><path d="M22 -42 L38 -31 L30 -48Z" fill="#e30613"/>';
const T=[{q:'Logo akan <b>ditempel di atas foto kegiatan</b> untuk poster digital.',need:{f:'png',tr:true,dmin:150},bg:'linear-gradient(135deg,#7aa6c2,#c9a96e)',cap:'Pratinjau di atas foto',ok:'PNG dengan latar transparan menyatu dengan foto, tanpa kotak putih.'},
 {q:'File dikirim ke <b>percetakan</b> untuk dicetak di spanduk.',need:{f:'pdf'},bg:'#fff8e1',cap:'Untuk percetakan',ok:'PDF menyimpan vektor dan siap cetak, jadi tetap tajam di ukuran besar.'},
 {q:'File disimpan supaya <b>bisa diedit lagi</b> bulan depan.',need:{f:'cdr'},bg:'#eef1ef',cap:'File kerja',ok:'CDR adalah file kerja CorelDRAW. Semua objek, node, dan warna masih bisa diedit.'},
 {q:'Kirim <b>pratinjau cepat</b> ke panitia lewat pesan. Latar putih tidak masalah, yang penting ukuran file kecil.',need:{f:'jpg',dmax:150},bg:'#e5ddd5',cap:'Pratinjau di aplikasi pesan',ok:'JPG berukuran kecil dan cocok untuk pratinjau di layar. Resolusi 72 sampai 150 dpi sudah cukup.'},
 {q:'Logo dicetak kecil di <b>sertifikat</b> (lebar 5 cm) sebagai gambar PNG.',need:{f:'png',dmin:300},bg:'#fffdf5',cap:'Hasil cetak sertifikat',ok:'Untuk dicetak, gambar PNG perlu 300 dpi supaya tidak pecah.'}];
let i,f,d,done;
function start(){i=0;done=false;$('win').classList.remove('on');show()}
function show(){f=null;d=null;$('tr').checked=false;$('goal').innerHTML=T[i].q;$('cnt').textContent=(i+1)+'/5';$('fb').textContent='';$('pv').style.background=T[i].bg;$('pv').innerHTML='';$('pc').textContent=T[i].cap;sync()}
function sync(){[...$('fmt').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===f));[...$('dpi').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==d));const r=f==='png'||f==='jpg';$('opts').style.display=r?'':'none';$('tr').disabled=f==='jpg';$('trl').style.opacity=f==='jpg'?.4:1;if(f==='jpg')$('tr').checked=false}
$('fmt').onclick=e=>{if(e.target.dataset.v){f=e.target.dataset.v;sync()}};$('dpi').onclick=e=>{if(e.target.dataset.v){d=+e.target.dataset.v;sync()}};
function render(){const pv=$('pv');let h;const svg='<svg viewBox="-110 -110 220 220" width="100%" height="100%">'+LOGO+'</svg>';
 if(f==='cdr')h='<div style="background:#fff;border:2px solid #2e9a4a;border-radius:10px;padding:14px;width:180px;text-align:center"><svg viewBox="-110 -110 220 220" width="120">'+LOGO+'</svg><div style="font-weight:800;color:#2e9a4a">logo.cdr</div><div class="mute">node dan warna bisa diedit</div></div>';
 else if(f==='pdf')h='<div style="background:#fff;border:2px solid #c00;border-radius:10px;padding:14px;width:180px;text-align:center"><svg viewBox="-110 -110 220 220" width="120">'+LOGO+'</svg><div style="font-weight:800;color:#c00">logo.pdf</div><div class="mute">vektor, siap cetak</div></div>';
 else{const px=d===72?28:d===150?60:200;const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d');const im=new Image();im.onload=()=>{if(!(f==='png'&&$('tr').checked)){x.fillStyle='#fff';x.fillRect(0,0,px,px)}x.drawImage(im,0,0,px,px);c.style.cssText='width:200px;height:200px;image-rendering:pixelated';pv.innerHTML='';pv.appendChild(c)};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -110 220 220">'+LOGO+'</svg>');return}
 pv.innerHTML=h}
$('go').onclick=()=>{if(!f){$('fb').textContent='Pilih format dulu.';return}if((f==='png'||f==='jpg')&&!d){$('fb').textContent='Pilih resolusinya dulu.';return}render();const n=T[i].need;let msg='';
 if(f!==n.f)msg={cdr:'CDR hanya bisa dibuka di CorelDRAW, kurang cocok untuk kebutuhan ini.',pdf:'PDF bagus untuk cetak dan dokumen, tetapi perhatikan lagi kebutuhannya.',png:'PNG cocok untuk gambar dengan latar transparan, tetapi coba pikirkan lagi kebutuhannya.',jpg:'JPG tidak bisa transparan dan kualitasnya berkurang karena dikompres.'}[f];
 else if(n.tr&&!$('tr').checked)msg='Lihat pratinjau: ada <b>kotak putih</b> di atas foto. Centang latar transparan.';
 else if(n.dmin&&d<n.dmin)msg='Lihat pratinjau: gambarnya <b>pecah</b>. Resolusinya terlalu kecil untuk kebutuhan ini.';
 else if(n.dmax&&d>n.dmax)msg='Bisa, tetapi file jadi lebih besar dari yang dibutuhkan. Untuk pratinjau di layar, resolusi kecil sudah cukup.';
 if(msg){$('fb').innerHTML='<span style="color:#ef5b3f">Belum tepat.</span> '+msg;return}
 $('fb').innerHTML='<span style="color:#1f8a4c">Tepat!</span> '+T[i].ok;i++;MPI.progress({i});if(i<T.length)setTimeout(show,2600);else if(!done){done=true;win('Ringkasnya: <b>CDR</b> untuk diedit, <b>PDF</b> untuk cetak, <b>PNG</b> untuk gambar transparan, dan <b>JPG</b> untuk pratinjau ringan. Untuk dicetak, gunakan <b>300 dpi</b>. Di CorelDRAW semuanya lewat <b>File > Export (Ctrl+E)</b>.');MPI.done({})}};</script></body></html>
